doctrine:
  dbal:
    default_connection: data
    connections:
      data:
        driver: pdo_pgsql
        url: '%env(resolve:ANALYTICS_DATABASE_URL)%'
        schema_filter: '~^(?!doctrine_migration_versions$)~'
      migrations:
        driver: pdo_pgsql
        url: '%env(resolve:ANALYTICS_DATABASE_URL)%'
  orm:
    naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
    mappings:
      Analysing:
        is_bundle: false
        type: attribute
        dir: '%kernel.project_dir%/src/Entity'
        prefix: 'App\Analysing\Entity'
