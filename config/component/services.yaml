parameters:
  analytics.idempotency_directory: '%kernel.project_dir%/var/analytics/idempotency'
  analytics.clickhouse.base: 'http://127.0.0.1:8123'
  analytics.clickhouse.user: 'default'
  analytics.clickhouse.pass: ''
  analytics.runtime.salt: 'analytics-default-salt'

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false
    bind:
      string $base: '%analytics.clickhouse.base%'
      string $user: '%analytics.clickhouse.user%'
      string $pass: '%analytics.clickhouse.pass%'
      string $salt: '%analytics.runtime.salt%'
      string $directory: '%analytics.idempotency_directory%'

  App\Analysing\:
    resource: '../../src/*'
    autowire: true
    autoconfigure: true
    exclude: '../../src/{DependencyInjection,Entity,Migrations,Tests}'

  App\Analysing\Controller\:
    resource: '../../src/Controller/'
    autowire: true
    autoconfigure: true
    tags: ['controller.service_arguments']
    public: true

  App\Analysing\Controller\AnalyticsAggregateControllerInterface: '@App\Analysing\Controller\AnalyticsAggregateController'
  App\Analysing\Controller\AnalyticsControllerInterface: '@App\Analysing\Controller\AnalyticsController'
