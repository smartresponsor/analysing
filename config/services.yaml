parameters:
  analytics.clickhouse.base: 'http://127.0.0.1:8123'
  analytics.clickhouse.user: 'default'
  analytics.clickhouse.pass: ''
  analytics.runtime.salt: 'analytics-default-salt'

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false
    bind:
      string $base: '%analytics.clickhouse.base%'
      string $user: '%analytics.clickhouse.user%'
      string $pass: '%analytics.clickhouse.pass%'
      string $salt: '%analytics.runtime.salt%'

  App\Controller\:
    resource: '../src/Controller/'
    tags: ['controller.service_arguments']
    public: true

  App\:
    resource: '../src/*'
    exclude: '../src/{DependencyInjection,Entity,Migrations,Tests,Kernel.php}'

  App\ControllerInterface\Analytics\AggregateControllerInterface: '@App\Controller\Analytics\AggregateController'
  App\ControllerInterface\Analytics\AnalyticsControllerInterface: '@App\Controller\Analytics\AnalyticsController'
