services:
  api-php:
    image: php:8.2-fpm
    volumes: [ ".:/var/www/html" ]
    working_dir: /var/www/html
  api-nginx:
    image: nginx:alpine
    depends_on: [ api-php ]
    ports: [ "8080:80" ]
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    ports: [ "8123:8123" ]
    volumes:
      - ch_data:/var/lib/clickhouse
volumes: { ch_data: {} }
